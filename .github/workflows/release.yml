name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Pack and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify tag matches Directory.Build.props
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Version $version in Directory.Build.props"
          }

      - name: Build
        run: dotnet build Sparc.slnx -c Release --no-incremental

      - name: Test
        run: dotnet test Sparc.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Sparc.slnx -c Release --no-build -o artifacts

      - name: Push packages and symbols to NuGet
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} artifacts/* --generate-notes
