name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Move NuGet caches to D: (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "NUGET_PACKAGES=D:\a\.nuget\packages" >> $env:GITHUB_ENV
          "NUGET_HTTP_CACHE_PATH=D:\a\.nuget\v3-cache" >> $env:GITHUB_ENV

      - name: Build (warnings are errors)
        run: dotnet build Sparc.slnx -c Release --no-incremental

      - name: Test (full suite)
        if: runner.os == 'Windows'
        run: dotnet test Sparc.slnx -c Release --no-build

      - name: Test (portable suites)
        if: runner.os != 'Windows'
        run: |
          dotnet test tests/Sparc.UnitTests/Sparc.UnitTests.csproj -c Release --no-build
          dotnet test tests/Sparc.ConcurrencyTests/Sparc.ConcurrencyTests.csproj -c Release --no-build
          dotnet test tests/Sparc.FuzzTests/Sparc.FuzzTests.csproj -c Release --no-build

      - name: Build samples
        run: dotnet build Sparc.Samples.slnx -c Release --no-incremental

      - name: Pack (validates NuGet metadata)
        if: runner.os == 'Windows'
        run: dotnet pack Sparc.slnx -c Release --no-build -o artifacts
