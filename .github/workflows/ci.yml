name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a new push cancels the previous run instead of queueing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: "Lint workflows (actionlint)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: "Run actionlint"
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  build-test:
    name: "Build and test (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Windows runners are tight on C:, so keep both NuGet caches on D:.
      - name: "Move NuGet caches to D: (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "NUGET_PACKAGES=D:\a\.nuget\packages" >> $env:GITHUB_ENV
          "NUGET_HTTP_CACHE_PATH=D:\a\.nuget\v3-cache" >> $env:GITHUB_ENV

      - name: "Install .NET SDK from global.json"
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Keyed on the files that decide package versions, so a bump in
      # Directory.Packages.props or any project file starts a fresh cache.
      - name: "Cache NuGet packages"
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && 'D:\a\.nuget\packages' || '~/.nuget/packages' }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', '**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: "Restore"
        run: dotnet restore Sparc.slnx

      - name: "Build (warnings are errors)"
        run: dotnet build Sparc.slnx -c Release --no-incremental --no-restore

      - name: "Test (full suite)"
        if: runner.os == 'Windows'
        run: dotnet test Sparc.slnx -c Release --no-build --no-restore

      - name: "Test (portable suites)"
        if: runner.os != 'Windows'
        run: |
          dotnet test tests/Sparc.UnitTests/Sparc.UnitTests.csproj -c Release --no-build --no-restore
          dotnet test tests/Sparc.ConcurrencyTests/Sparc.ConcurrencyTests.csproj -c Release --no-build --no-restore
          dotnet test tests/Sparc.FuzzTests/Sparc.FuzzTests.csproj -c Release --no-build --no-restore

      - name: "Restore samples"
        run: dotnet restore Sparc.Samples.slnx

      - name: "Build samples"
        run: dotnet build Sparc.Samples.slnx -c Release --no-incremental --no-restore

      - name: "Pack (validates NuGet metadata)"
        if: runner.os == 'Windows'
        run: dotnet pack Sparc.slnx -c Release --no-build --no-restore -o artifacts
