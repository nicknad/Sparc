name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build Sparc.slnx -c Release --no-incremental

      - name: Test
        run: dotnet test Sparc.slnx -c Release --no-build

      - name: Build samples
        run: dotnet build Sparc.Samples.slnx -c Release --no-incremental
