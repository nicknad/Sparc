name: Bug report
description: Report a defect in the ring, session layer, transports or CLIs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security issues;
        see SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the observed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, code or CLI commands that reproduce the issue.
      placeholder: |
        producer --name demo --count 1000000 --size 64
        consumer --name demo --count 1000000
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target framework
      options:
        - net11.0
        - net8.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: CLI output, exit codes, stack traces, benchmark numbers.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I can reproduce this on the current `main`.
          required: true
